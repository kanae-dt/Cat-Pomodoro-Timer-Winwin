<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Focus Timer</title>
    <style>
        body {
            background-color: #f8f9fa; /* よりクリーンな背景色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .widget-card {
            background-color: white;
            width: 320px;
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .cat-container {
            width: 100%;
            height: 220px;
            background-size: cover;
            background-position: center;
            transition: background-image 0.6s ease-in-out;
            position: relative;
        }

        /* 休憩中、少しだけオーバーレイをかけて視覚的に変化させる */
        .cat-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.03);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .is-break .cat-container::after {
            opacity: 1;
        }

        .timer-content {
            padding: 32px 24px;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            background-color: #f0f0f0;
            color: #888;
            transition: all 0.3s ease;
        }

        .mode-label {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .time {
            font-size: 72px;
            font-weight: 300;
            color: #1d1d1f;
            margin: 0 0 24px 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .start-btn {
            background-color: #ff8e88;
            color: white;
            border: none;
            padding: 16px 0;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* 画面が小さい時のレスポンシブ対応 */
        @media (max-width: 350px) or (max-height: 550px) {
            .widget-card { transform: scale(0.85); }
        }
    </style>
</head>
<body>

<div class="widget-card" id="mainCard">
    <div class="cat-container" id="catBg"></div>
    <div class="timer-content">
        <span class="status-badge" id="statusBadge">FOCUS</span>
        <div class="mode-label" id="modeLabel">Stay focused, nya!</div>
        <div class="time" id="timerDisplay">25:00</div>
        <button class="start-btn" id="startBtn" onclick="toggle()">START</button>
    </div>
</div>

<script>
    let time = 25 * 60;
    let running = false;
    let interval = null;
    let isWorkMode = true;

    const catBg = document.getElementById('catBg');
    const display = document.getElementById('timerDisplay');
    const label = document.getElementById('modeLabel');
    const badge = document.getElementById('statusBadge');
    const startBtn = document.getElementById('startBtn');
    const mainCard = document.getElementById('mainCard');

    function updateBackground() {
        if (!isWorkMode) {
            catBg.style.backgroundImage = "url('cat_break.jpeg')";
            badge.innerText = "BREAK";
            badge.style.backgroundColor = "#e1f5fe";
            badge.style.color = "#039be5";
            label.innerText = "Time to relax, nya.";
            mainCard.classList.add('is-break');
            return;
        }

        mainCard.classList.remove('is-break');
        badge.style.backgroundColor = "#fff0f0";
        badge.style.color = "#ff5a5f";
        
        if (time > 10 * 60) {
            catBg.style.backgroundImage = "url('cat_start.jpeg')";
            badge.innerText = "FOCUS";
            label.innerText = "Stay focused, nya!";
        } else if (time > 5 * 60) {
            catBg.style.backgroundImage = "url('cat_mid.jpeg')";
            badge.innerText = "STEADY";
            label.innerText = "Almost there, nya!";
        } else {
            catBg.style.backgroundImage = "url('cat_finish.PNG')";
            badge.innerText = "LAST SPURT";
            label.innerText = "You can do it, nya!";
        }
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        display.innerText = `${min}:${sec < 10 ? '0' + sec : sec}`;
        document.title = display.innerText + " | Cat Timer";
    }

    function toggle() {
        if (running) {
            clearInterval(interval);
            startBtn.innerText = "RESUME";
            startBtn.style.backgroundColor = "#ffb388";
