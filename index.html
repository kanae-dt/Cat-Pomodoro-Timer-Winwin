<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Focus Timer</title>
    <style>
        body {
            background-color: #fcf8f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .widget {
            background-color: white;
            width: 320px;
            padding: 40px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        #catBg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            transition: background-image 0.6s ease-in-out;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.15em;
            margin-bottom: 20px; /* メッセージがない分、少し余白を広げました */
            background-color: rgba(240, 240, 240, 0.8);
            color: #888;
            transition: all 0.3s ease;
        }

        .time {
            font-family: "Varela Round", sans-serif;
            font-size: 84px;
            font-weight: 400;
            color: #1d1d1f;
            margin: 0 0 35px 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .start-btn {
            background-color: #ff8e88;
            color: white;
            border: none;
            padding: 18px 0;
            border-radius: 22px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 17px;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 142, 136, 0.2);
        }

        .start-btn:hover { opacity: 0.9; }
        .start-btn:active { transform: scale(0.97); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>

<div class="widget">
    <div id="catBg"></div>
    <span class="status-badge" id="statusBadge">FOCUS</span>
    <div class="time" id="timerDisplay">25:00</div>
    <button class="start-btn" id="startBtn" onclick="toggle()">START</button>
</div>

<script>
    let time = 25 * 60;
    let running = false;
    let interval = null;
    let isWorkMode = true;

    const catBg = document.getElementById('catBg');
    const display = document.getElementById('timerDisplay');
    const badge = document.getElementById('statusBadge');
    const startBtn = document.getElementById('startBtn');

    function playAlarm() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    }

    function updateBackground() {
        if (!isWorkMode) {
            catBg.style.backgroundImage = "url('cat_break.jpeg')";
            badge.innerText = "BREAK";
            badge.style.backgroundColor = "#e1f5fe";
            badge.style.color = "#039be5";
            return;
        }

        badge.style.backgroundColor = "#fff0f0";
        badge.style.color = "#ff5a5f";
        
        if (time > 10 * 60) {
            catBg.style.backgroundImage = "url('cat_start.jpeg')";
            badge.innerText = "FOCUS";
        } else if (time > 5 * 60) {
            catBg.style.backgroundImage = "url('cat_mid.jpeg')";
            badge.innerText = "FOCUS";
        } else {
            catBg.style.backgroundImage = "url('cat_finish.PNG')";
            badge.innerText = "FOCUS";
        }
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        display.innerText = `${min}:${sec < 10 ? '0' + sec : sec}`;
        document.title = display.innerText + " | Focus";
    }

    function toggle() {
        if (running) {
            clearInterval(interval);
            startBtn.innerText = "RESUME";
            startBtn.style.backgroundColor = "#ffb388";
        } else {
            interval = setInterval(() => {
                time--;
                updateDisplay();
                updateBackground();
                if (time <= 0) finish();
            }, 1000);
            startBtn.innerText = "STOP";
            startBtn.style.backgroundColor = "#ff8e88";
        }
        running = !running;
    }

    function finish() {
        clearInterval(interval);
        running = false;
        playAlarm();
        
        if (isWorkMode) {
            isWorkMode = false;
            time = 5 * 60;
        } else {
            isWorkMode = true;
            time = 25 * 60;
        }
        
        updateDisplay();
        updateBackground();
        startBtn.innerText = "START";
        startBtn.style.backgroundColor = "#ff8e88";
    }

    updateBackground();
    updateDisplay();
</script>

</body>
</html>
