<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Focus Timer</title>
    <style>
        body {
            background-color: #fcf8f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 枠のサイズは元のまま */
        .widget {
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
            /* ここで写真を枠内に閉じ込めます */
            overflow: hidden;
        }

        /* 写真を枠の背景として表示（サイズ調整は自動） */
        #catBg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 文字の裏側に配置 */
            background-size: cover; /* 写真を枠いっぱいに広げる（自動調整） */
            background-position: center; /* 写真の真ん中を表示 */
            opacity: 0.3; /* 写真がうるさくないよう、透けさせます */
            transition: background-image 0.6s ease-in-out;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            background-color: rgba(240, 240, 240, 0.8);
            color: #888;
        }

        .mode-label {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .time {
            font-size: 72px;
            font-weight: 200;
            color: #1d1d1f;
            margin: 0 0 25px 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .start-btn {
            background-color: #ff8e88;
            color: white;
            border: none;
            padding: 16px 0;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .start-btn:hover { opacity: 0.9; }
        .start-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="widget">
    <!-- 写真を表示するレイヤー -->
    <div id="catBg"></div>

    <span class="status-badge" id="statusBadge">FOCUS</span>
    <div class="mode-label" id="modeLabel">Session started</div>
    <div class="time" id="timerDisplay">25:00</div>
    <button class="start-btn" id="startBtn" onclick="toggle()">START</button>
</div>

<script>
    let time = 25 * 60;
    let running = false;
    let interval = null;
    let isWorkMode = true;

    const catBg = document.getElementById('catBg');
    const display = document.getElementById('timerDisplay');
    const label = document.getElementById('modeLabel');
    const badge = document.getElementById('statusBadge');
    const startBtn = document.getElementById('startBtn');

    function updateBackground() {
        if (!isWorkMode) {
            catBg.style.backgroundImage = "url('cat_break.jpeg')";
            badge.innerText = "BREAK";
            label.innerText = "Take a short break";
            return;
        }

        if (time > 10 * 60) {
            catBg.style.backgroundImage = "url('cat_start.jpeg')";
            badge.innerText = "FOCUS";
            label.innerText = "Session started";
        } else if (time > 5 * 60) {
            catBg.style.backgroundImage = "url('cat_mid.jpeg')";
            badge.innerText = "FOCUS";
            label.innerText = "10 minutes left";
        } else {
            catBg.style.backgroundImage = "url('cat_finish.PNG')";
            badge.innerText = "FOCUS";
            label.innerText = "5 minutes left";
        }
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        display.innerText = `${min}:${sec < 10 ? '0' + sec : sec}`;
        document.title = display.innerText + " | Focus";
    }

    function toggle() {
        if (running) {
            clearInterval(interval);
            startBtn.innerText = "RESUME";
            startBtn.style.backgroundColor = "#ffb388";
        } else {
            // ここが動くようにしっかり修正しました！
            interval = setInterval(() => {
                time--;
                updateDisplay();
                updateBackground();
                if (time <= 0) finish();
            }, 1000);
            startBtn.innerText = "STOP";
            startBtn.style.backgroundColor = "#ff8e88";
        }
        running = !running;
    }

    function finish() {
        clearInterval(interval);
        running = false;
        if (isWorkMode) {
            isWorkMode = false;
            time = 5 * 60;
        } else {
            isWorkMode = true;
            time = 25 * 60;
        }
        updateDisplay();
        updateBackground();
        startBtn.innerText = "START";
    }

    // 初回読み込み
    updateBackground();
    updateDisplay();
</script>

</body>
</html>
