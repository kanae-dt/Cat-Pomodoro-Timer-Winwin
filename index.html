<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこ応援タイマー</title>
    <style>
        /* 背景画像の設定 */
        body {
            background-color: #fdf6f0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #catBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 1.0s ease-in-out;
            background-color: #fdf6f0;
        }

        /* タイマーの外観 */
        .widget {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            width: 260px;
            padding: 40px 20px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .mode-label {
            font-size: 18px;
            font-weight: bold;
            color: #ff8e88;
            margin-bottom: 10px;
        }

        .time {
            font-size: 72px;
            font-weight: bold;
            color: #444;
            margin: 10px 0 25px 0;
            font-variant-numeric: tabular-nums;
        }

        .start-btn {
            background-color: #ff8e88;
            color: white;
            border: none;
            padding: 15px 0;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            font-size: 18px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 142, 136, 0.3);
        }

        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<!-- 背景画像を表示するエリア -->
<div id="catBg"></div>

<div class="widget">
    <div class="mode-label" id="modeLabel">集中タイムニャ！</div>
    <div class="time" id="timerDisplay">25:00</div>
    <button class="start-btn" id="startBtn" onclick="toggle()">START</button>
</div>

<script>
    let time = 25 * 60;
    let running = false;
    let interval = null;
    let isWorkMode = true;

    const catBg = document.getElementById('catBg');
    const display = document.getElementById('timerDisplay');
    const label = document.getElementById('modeLabel');
    const startBtn = document.getElementById('startBtn');

    // GitHubのファイル名（大文字小文字・拡張子）に完全に合わせています
    function updateBackground() {
        if (!isWorkMode) {
            catBg.style.backgroundImage = "url('cat_break.jpeg')";
            label.innerText = "おやすみニャ〜";
            return;
        }

        if (time > 10 * 60) {
            // 25分〜10分
            catBg.style.backgroundImage = "url('cat_start.jpeg')";
            label.innerText = "集中タイムニャ！";
        } else if (time > 5 * 60) {
            // 10分〜5分
            catBg.style.backgroundImage = "url('cat_mid.jpeg')";
            label.innerText = "あと少しニャ！";
        } else {
            // 5分〜0分
            catBg.style.backgroundImage = "url('cat_finish.PNG')";
            label.innerText = "全力応援中ニャ！";
        }
    }

    function updateDisplay() {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        display.innerText = `${min}:${sec < 10 ? '0' + sec : sec}`;
        document.title = display.innerText + " | ねこ応援";
    }

    function toggle() {
        if (running) {
            clearInterval(interval);
            startBtn.innerText = "RESUME";
            startBtn.style.backgroundColor = "#ffb388";
        } else {
            interval = setInterval(() => {
                time--;
                updateDisplay();
                updateBackground();
                if (time <= 0) {
                    finish();
                }
            }, 1000);
            startBtn.innerText = "STOP";
            startBtn.style.backgroundColor = "#ff8e88";
        }
        running = !running;
    }

    function finish() {
        clearInterval(interval);
        running = false;
        if (isWorkMode) {
            alert("作業終了ニャ！5分休むニャ！");
            isWorkMode = false;
            time = 5 * 60;
        } else {
            alert("休憩終了ニャ！25分頑張るニャ！");
            isWorkMode = true;
            time = 25 * 60;
        }
        updateDisplay();
        updateBackground();
        startBtn.innerText = "START";
    }

    // 最初にページを開いた時にも背景を表示させる
    updateBackground();
    updateDisplay();
</script>

</body>
</html>
